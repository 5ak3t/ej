# Continuous delivery: on a pushed tag v*, run both test jobs (tests.yml), build the sdist and the wheel, write SHA256SUMS
# and create a GitHub Release with them and the release notes docs/releases/<version>.md (gh CLI, GITHUB_TOKEN).
# Then the `pypi` job uploads the same files to PyPI as `ejai` (import name `ej`) by trusted publishing (OIDC): no stored
# token. One-time setup on pypi.org: a (pending) trusted publisher for project ejai, owner 5ak3t, repository ej, workflow
# release.yml, environment pypi.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the tag against the package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }
          test -f "docs/releases/${VERSION}.md"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: SHA256SUMS
        run: |
          (cd dist && sha256sum *) > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release published from the GitHub web UI creates the tag and the release together: fill that one in.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" --title "ej ${VERSION}" --notes-file "docs/releases/${VERSION}.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --title "ej ${VERSION}" --notes-file "docs/releases/${VERSION}.md"
          fi

  pypi:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ejai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.12.4
