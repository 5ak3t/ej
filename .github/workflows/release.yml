# Continuous delivery: on a pushed tag v*, run both test jobs (tests.yml), build the sdist and the wheel, write SHA256SUMS
# and create a GitHub Release with them and the release notes docs/releases/<version>.md (gh CLI, GITHUB_TOKEN).
# No PyPI publishing (no credential is configured). To add it later: create a PyPI trusted publisher for this repository
# and workflow, add a job with `permissions: id-token: write` that downloads the `dist` artifact and runs
# pypa/gh-action-pypi-publish (pinned to a release); no stored token is needed with trusted publishing.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the tag against the package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }
          test -f "docs/releases/${VERSION}.md"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: SHA256SUMS
        run: |
          (cd dist && sha256sum *) > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --title "ej ${VERSION}" --notes-file "docs/releases/${VERSION}.md"
