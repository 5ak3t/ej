# Tests on every push to main, on pull requests and on manual dispatch; release.yml calls this workflow for a tag.
# No secrets: the weights are downloaded from the PUBLIC Hugging Face repository 5ak3t/ej at the pinned tag and checked
# against their SHA-256 before any test reads them. Read-only token.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  EJ_HF_REPO: 5ak3t/ej
  EJ_HF_REVISION: v0.0.1
  EJ_PACK_SHA256: e990e1846cba43f8405a969c606057f2fd6e2076595f4a34d202e8fc531891b0
jobs:
  lint-and-unit:
    name: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch 2.5.1)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,train]'
      - name: File length (300-line rule)
        run: python scripts/check_file_length.py
      - name: Tests without weights
        run: PYTHONPATH=. python -m pytest -q -rs

  weights:
    name: weights
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch 2.5.1)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,train]'
      - name: Download model.ejpack from the Hugging Face Hub
        env:
          HF_HOME: ${{ runner.temp }}/hf
          WEIGHTS_DIR: ${{ runner.temp }}/weights
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(os.environ['EJ_HF_REPO'], 'model.ejpack', revision=os.environ['EJ_HF_REVISION'],
                              local_dir=os.environ['WEIGHTS_DIR'])
          print(p, os.path.getsize(p), 'bytes')
          PY
          echo "${EJ_PACK_SHA256}  ${WEIGHTS_DIR}/model.ejpack" | sha256sum -c -
      - name: Tests with weights
        env:
          EJ_WEIGHTS: ${{ runner.temp }}/weights/model.ejpack
          EJ_CACHE: ${{ runner.temp }}/ej-cache
        run: PYTHONPATH=. python -m pytest -q -rs
