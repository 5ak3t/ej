# Tests that need no weights. Runs on pull requests and on manual dispatch only: no push trigger, no schedule, no deployment,
# no secrets, read-only token. The prediction tests skip without EJ_WEIGHTS; run them locally with
# EJ_WEIGHTS=/path/to/model.ejpack.
name: tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: File length (300-line rule)
        run: python scripts/check_file_length.py
      - name: Tests without weights
        run: python -m pytest -q -rs
