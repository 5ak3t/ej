[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ejai"
version = "0.0.1.post2"
description = "Calibrated typed decisions (choice / yes-no / score) in one pass, on device, without generating tokens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Saket Bhushan" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lower bounds are the versions the release was tested with (Python 3.11.15, CPU); upper bounds stop at the next major.
dependencies = [
    "torch>=2.5.1,<3",
    "transformers>=5.18.0,<5.19",  # 5.19 needs torch >= 2.6 (torch.accelerator)
    "tokenizers>=0.23.2,<1",
    "safetensors>=0.8.0,<1",
    "huggingface_hub>=1.33.0,<2",
    "numpy>=2.2.6,<3",
    "sentencepiece>=0.2.2,<0.3",  # the prediction runtime (ej/_runtime/student_nli.py) imports both
    "protobuf>=7.36.2,<8",
]

[project.optional-dependencies]
eval = ["scipy>=1.17.1,<2"]
train = ["scipy>=1.17.1,<2"]
test = ["pytest>=8", "scipy>=1.17.1,<2", "pyyaml>=6.0.3,<7"]

[project.urls]
Homepage = "https://github.com/5ak3t/ej"
Weights = "https://huggingface.co/5ak3t/ej"

[tool.setuptools]
packages = ["ej", "ej.eval", "ej.pack", "ej.train"]

[tool.setuptools.package-data]
ej = ["_runtime/*.py", "_runtime/RUNTIME_SHA256", "_runtime/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "benchmarks"]
